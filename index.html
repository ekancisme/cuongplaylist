<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Thêm Content Security Policy (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    
    <title>Cuong Playlist</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="player-container">
        <div class="dashboard">
            <div id="current-song-img" class="cd-thumb">
                <img src="img/0.jpg" alt="Album Art">
            </div>
            <div class="control">
                <div class="btn btn-prev">Prev</div>
                <div class="btn btn-play">Play</div>
                <div class="btn btn-next">Next</div>
            </div>
            <audio id="audio-player" src=""></audio>
        </div>
        
        <div class="playlist-container">
            <div id="playlist"></div>
        </div>
    </div>

    <script src="js/songlist.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
